openapi: 3.2.0
info:
  title: Reference pods > lists API
  version: 1.0.0
servers:
- url: https://api.agentmail.to
  description: prod
- url: https://x402.api.agentmail.to
  description: prod-x402
- url: https://mpp.api.agentmail.to
  description: prod-mpp
- url: https://api.agentmail.eu
  description: eu-prod
tags:
- name: pods > lists
paths:
  /v0/pods/{pod_id}/lists/{direction}/{type}:
    get:
      operationId: pods_lists_list
      summary: List Entries
      description: '**CLI:**

        ```bash

        agentmail pods lists list --pod-id --direction --type

        ```'
      tags:
      - pods > lists
      parameters:
      - name: pod_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/pods_PodId'
      - name: direction
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/lists_Direction'
      - name: type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/lists_ListType'
      - name: limit
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Limit'
      - name: page_token
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PageToken'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lists_PodListListEntriesResponse'
      security:
      - Bearer: []
    post:
      operationId: pods_lists_create
      summary: Create List Entry
      description: '**CLI:**

        ```bash

        agentmail pods lists create --pod-id --direction --type --entry user@example.com

        ```'
      tags:
      - pods > lists
      parameters:
      - name: pod_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/pods_PodId'
      - name: direction
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/lists_Direction'
      - name: type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/lists_ListType'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lists_PodListEntry'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/lists_CreateListEntryRequest'
      security:
      - Bearer: []
  /v0/pods/{pod_id}/lists/{direction}/{type}/{entry}:
    get:
      operationId: pods_lists_get
      summary: Get List Entry
      description: '**CLI:**

        ```bash

        agentmail pods lists get --pod-id --direction --type --entry

        ```'
      tags:
      - pods > lists
      parameters:
      - name: pod_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/pods_PodId'
      - name: direction
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/lists_Direction'
      - name: type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/lists_ListType'
      - name: entry
        in: path
        description: Email address or domain.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lists_PodListEntry'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
    delete:
      operationId: pods_lists_delete
      summary: Delete List Entry
      description: '**CLI:**

        ```bash

        agentmail pods lists delete --pod-id --direction --type --entry

        ```'
      tags:
      - pods > lists
      parameters:
      - name: pod_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/pods_PodId'
      - name: direction
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/lists_Direction'
      - name: type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/lists_ListType'
      - name: entry
        in: path
        description: Email address or domain.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
components:
  schemas:
    ErrorName:
      type: string
      description: Name of error.
      title: ErrorName
    ErrorFix:
      type: string
      description: The concrete next action that resolves the error.
      title: ErrorFix
    ErrorMessage:
      type: string
      description: Error message.
      title: ErrorMessage
    OrganizationId:
      type: string
      description: ID of organization.
      title: OrganizationId
    ErrorCode:
      type: string
      description: Stable, machine-readable error code in snake_case (for example, not_found or missing_permission). Branch on this rather than the message text.
      title: ErrorCode
    pods_PodId:
      type: string
      description: ID of pod.
      title: PodId
    Count:
      type: integer
      description: Number of items returned.
      title: Count
    lists_ListType:
      type: string
      enum:
      - allow
      - block
      description: Type of list entry.
      title: ListType
    lists_PodListEntry:
      type: object
      properties:
        entry:
          type: string
          description: Email address or domain of list entry.
        organization_id:
          $ref: '#/components/schemas/OrganizationId'
        reason:
          type: string
          description: Reason for adding the entry.
        direction:
          $ref: '#/components/schemas/lists_Direction'
        list_type:
          $ref: '#/components/schemas/lists_ListType'
        entry_type:
          $ref: '#/components/schemas/lists_EntryType'
        created_at:
          type: string
          format: date-time
          description: Time at which entry was created.
        read_only:
          type: boolean
          description: Whether the entry is read-only and cannot be deleted via the API.
        pod_id:
          type: string
          description: ID of pod.
        inbox_id:
          type: string
          description: ID of inbox, if entry is inbox-scoped.
      required:
      - entry
      - organization_id
      - direction
      - list_type
      - entry_type
      - created_at
      - pod_id
      title: PodListEntry
    PageToken:
      type: string
      description: Page token for pagination.
      title: PageToken
    lists_Direction:
      type: string
      enum:
      - send
      - receive
      - reply
      description: Direction of list entry.
      title: Direction
    lists_CreateListEntryRequest:
      type: object
      properties:
        entry:
          type: string
          description: Email address or domain to add.
        reason:
          type: string
          description: Reason for adding the entry.
      required:
      - entry
      title: CreateListEntryRequest
    ValidationErrorResponse:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/ErrorName'
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/ErrorMessage'
        errors:
          description: Validation errors. Each entry has a path and a message identifying the invalid field.
        fix:
          $ref: '#/components/schemas/ErrorFix'
        docs:
          $ref: '#/components/schemas/ErrorDocs'
      required:
      - name
      - errors
      title: ValidationErrorResponse
    ErrorResponse:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/ErrorName'
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/ErrorMessage'
        fix:
          $ref: '#/components/schemas/ErrorFix'
        docs:
          $ref: '#/components/schemas/ErrorDocs'
      required:
      - name
      - message
      title: ErrorResponse
    ErrorDocs:
      type: string
      description: Link to the error reference entry for this code.
      title: ErrorDocs
    Limit:
      type: integer
      description: Limit of number of items returned.
      title: Limit
    lists_PodListListEntriesResponse:
      type: object
      properties:
        count:
          $ref: '#/components/schemas/Count'
        limit:
          $ref: '#/components/schemas/Limit'
        next_page_token:
          $ref: '#/components/schemas/PageToken'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/lists_PodListEntry'
          description: Ordered by entry ascending.
      required:
      - count
      - entries
      title: PodListListEntriesResponse
    lists_EntryType:
      type: string
      enum:
      - email
      - domain
      description: Whether the entry is an email address or domain.
      title: EntryType
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: AgentMail
  source: https://docs.agentmail.to/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
