openapi: 3.2.0
info:
  title: Reference Threads API
  version: 1.0.0
servers:
- url: https://api.agentmail.to
  description: prod
- url: https://x402.api.agentmail.to
  description: prod-x402
- url: https://mpp.api.agentmail.to
  description: prod-mpp
- url: https://api.agentmail.eu
  description: eu-prod
tags:
- name: Threads
paths:
  /v0/threads:
    get:
      operationId: threads_list
      summary: List Threads
      description: 'Lists threads, most recent first. Pass `senders`, `recipients`, or

        `subject` to filter by substring. Filtered requests are served by

        search, which caps `limit` at 100. For relevance-ranked full-text

        search across senders, recipients, subject, and message body, use

        `Search Threads`.


        **CLI:**

        ```bash

        agentmail threads list

        ```'
      tags:
      - Threads
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Limit'
      - name: page_token
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PageToken'
      - name: labels
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Labels'
      - name: before
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Before'
      - name: after
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/After'
      - name: ascending
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Ascending'
      - name: include_spam
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/IncludeSpam'
      - name: include_blocked
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/IncludeBlocked'
      - name: include_unauthenticated
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/IncludeUnauthenticated'
      - name: include_trash
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/IncludeTrash'
      - name: senders
        in: query
        description: Filter to threads whose senders contain this value (substring match). Repeatable; all values must match.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: recipients
        in: query
        description: Filter to threads whose recipients contain this value (substring match). Repeatable; all values must match.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: subject
        in: query
        description: Filter to threads whose subject contains this value (substring match). Repeatable; all values must match.
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/threads_ListThreadsResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
  /v0/threads/search:
    get:
      operationId: threads_search
      summary: Search Threads
      description: 'Full-text search across threads in the organization, ranked by

        relevance. The query is matched against senders, recipients, and

        subject (substring) and the message body (tokenized full text). Spam,

        trash, blocked, and unauthenticated threads are always excluded.

        `limit` cannot exceed 100.'
      tags:
      - Threads
      parameters:
      - name: q
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Query'
      - name: limit
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Limit'
      - name: page_token
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PageToken'
      - name: before
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Before'
      - name: after
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/After'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/threads_SearchThreadsResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
  /v0/threads/{thread_id}:
    get:
      operationId: threads_get
      summary: Get Thread
      description: '**CLI:**

        ```bash

        agentmail threads get --thread-id

        ```'
      tags:
      - Threads
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/threads_ThreadId'
      - name: limit
        in: query
        description: Maximum number of messages to return. Cannot exceed 100.
        required: false
        schema:
          $ref: '#/components/schemas/Limit'
      - name: page_token
        in: query
        description: Token returned by the previous response for retrieving the next, older page.
        required: false
        schema:
          $ref: '#/components/schemas/PageToken'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/threads_Thread'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
    patch:
      operationId: threads_update
      summary: Update Thread
      description: Updates thread labels. Cannot add or remove system labels (sent, received, bounced, etc.). Rejects requests with a `422` for threads with 100 or more messages.
      tags:
      - Threads
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/threads_ThreadId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/threads_UpdateThreadResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Error response with status 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/threads_UpdateThreadRequest'
      security:
      - Bearer: []
    delete:
      operationId: threads_delete
      summary: Delete Thread
      description: 'Permanently deletes a thread and all of its messages.


        **CLI:**

        ```bash

        agentmail threads delete --thread-id

        ```'
      tags:
      - Threads
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/threads_ThreadId'
      responses:
        '200':
          description: Successful response
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
  /v0/threads/{thread_id}/attachments/{attachment_id}:
    get:
      operationId: threads_getAttachment
      summary: Get Attachment
      description: '**CLI:**

        ```bash

        agentmail threads get-attachment --thread-id --attachment-id

        ```'
      tags:
      - Threads
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/threads_ThreadId'
      - name: attachment_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/attachments_AttachmentId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/attachments_AttachmentResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
components:
  schemas:
    threads_ThreadSize:
      type: integer
      description: Size of thread in bytes.
      title: ThreadSize
    PageToken:
      type: string
      description: Page token for pagination.
      title: PageToken
    threads_SearchThreadHighlights:
      type: object
      properties:
        from:
          type: array
          items:
            type: string
          description: Matched fragments from a sender address in the thread.
        recipients:
          type: array
          items:
            type: string
          description: Matched fragments from a recipient address in the thread (to, cc, or bcc).
        subject:
          type: array
          items:
            type: string
          description: Matched fragments from the subject.
        text:
          type: array
          items:
            type: string
          description: Matched fragments from a message body in the thread.
      description: 'Matched fragments per field on a thread search result, with matched terms

        wrapped in `**`. A field key is present only when the query matched that

        field, so the present keys also tell you which fields produced the hit.'
      title: SearchThreadHighlights
    ErrorDocs:
      type: string
      description: Link to the error reference entry for this code.
      title: ErrorDocs
    messages_MessageAuthenticationResults:
      type: object
      properties:
        spf:
          $ref: '#/components/schemas/messages_MessageAuthenticationVerdict'
        dkim:
          $ref: '#/components/schemas/messages_MessageAuthenticationVerdict'
        dmarc:
          $ref: '#/components/schemas/messages_MessageAuthenticationVerdict'
        spf_domain:
          $ref: '#/components/schemas/messages_MessageAuthenticationDomain'
          description: Envelope MAIL FROM domain the `spf` verdict is about (`smtp.mailfrom`).
        dkim_domain:
          $ref: '#/components/schemas/messages_MessageAuthenticationDomain'
          description: 'Signing domain the `dkim` verdict is about (`header.d`). Present only when `dkim` is

            `pass` or `fail`.'
        dmarc_domain:
          $ref: '#/components/schemas/messages_MessageAuthenticationDomain'
          description: From domain the `dmarc` verdict is about (`header.from`).
        arc_sealer:
          $ref: '#/components/schemas/messages_MessageAuthenticationDomain'
          description: 'Domain of the trusted forwarder whose ARC seal the verdicts were taken from, such as

            `google.com`. Present only on forwarded mail, and only beside at least one verdict.'
      description: "Per-mechanism SPF, DKIM, and DMARC verdicts for a received message, each with the domain it\nis about, kept only where they speak for the sender's From identity. A verdict that could\nnot be computed is absent, so the field can be `{}`. The field is absent on sent messages\nand on messages received before 2026-09-09; the `*_domain` and `arc_sealer` keys appear on\nmessages received after they were introduced.\n\nThe verdicts are the ones Amazon SES computed when the message reached AgentMail, with one\nexception. Forwarded mail fails DMARC at the receiving hop by construction. When AgentMail\ndelivers a forwarded message as authenticated because a trusted forwarder (such as Google or\nMicrosoft) sealed a valid ARC chain vouching for the original, the field reports the\nverdicts that forwarder recorded for the original message, and `arc_sealer` names it.\n\n- `spf` is about the envelope MAIL FROM (Return-Path) domain, named in `spf_domain`. It is\n  present only when that domain is aligned with the sender's domain (the From mailbox, or\n  the Sender header when From spans domains), meaning the two share an organizational\n  domain: `mail.example.com` is aligned with `example.com`. An unaligned SPF result is\n  withheld whatever its value.\n- `dkim` is the DKIM verdict, and `dkim_domain` the signing domain (the `d=` tag). On\n  directly received mail the domain is named only when every DKIM signature on the message\n  is from the same domain; a message signed by more than one domain (a sender and its email\n  provider, for instance) keeps the verdict and omits the domain. `dkim_domain` is the\n  signing domain as written, so compare it with the From domain before relying on it.\n- `dmarc` is the DMARC verdict for the From domain, named in `dmarc_domain`.\n- `dkim` and `dmarc` are withheld when the From list spans more than one domain or could not\n  be fully parsed.\n- On forwarded mail each sealed verdict is reported only when the domain the forwarder\n  recorded it for matches the message's current From domain. If the forwarder rewrote From,\n  or vouched for nothing, the field is `{}`.\n\nThe `unauthenticated` label, not this field, is AgentMail's acceptance decision, and it uses\na looser rule, so the two can disagree: a single-From message whose only pass is an\nunaligned envelope SPF is delivered without the label while this field shows no pass. Use\nthe label to tell whether AgentMail accepted the message as legitimate, and this field to\nsee which domain each mechanism authenticated. Do not reject mail on `dmarc: fail` alone."
      title: MessageAuthenticationResults
    messages_MessageInReplyTo:
      type: string
      description: ID of message being replied to.
      title: MessageInReplyTo
    threads_SearchThreadsResponse:
      type: object
      properties:
        count:
          $ref: '#/components/schemas/Count'
        limit:
          $ref: '#/components/schemas/Limit'
        next_page_token:
          $ref: '#/components/schemas/PageToken'
        threads:
          type: array
          items:
            $ref: '#/components/schemas/threads_SearchThreadItem'
          description: Ordered by relevance, best match first.
      required:
      - count
      - threads
      title: SearchThreadsResponse
    Before:
      type: string
      format: date-time
      description: Timestamp before which to filter by.
      title: Before
    threads_Thread:
      type: object
      properties:
        inbox_id:
          $ref: '#/components/schemas/inboxes_InboxId'
        thread_id:
          $ref: '#/components/schemas/threads_ThreadId'
        labels:
          $ref: '#/components/schemas/threads_ThreadLabels'
        timestamp:
          $ref: '#/components/schemas/threads_ThreadTimestamp'
        received_timestamp:
          $ref: '#/components/schemas/threads_ThreadReceivedTimestamp'
        sent_timestamp:
          $ref: '#/components/schemas/threads_ThreadSentTimestamp'
        senders:
          $ref: '#/components/schemas/threads_ThreadSenders'
        recipients:
          $ref: '#/components/schemas/threads_ThreadRecipients'
        subject:
          $ref: '#/components/schemas/threads_ThreadSubject'
        preview:
          $ref: '#/components/schemas/threads_ThreadPreview'
        attachments:
          $ref: '#/components/schemas/threads_ThreadAttachments'
        last_message_id:
          $ref: '#/components/schemas/threads_ThreadLastMessageId'
        message_count:
          $ref: '#/components/schemas/threads_ThreadMessageCount'
        size:
          $ref: '#/components/schemas/threads_ThreadSize'
        updated_at:
          $ref: '#/components/schemas/threads_ThreadUpdatedAt'
        created_at:
          $ref: '#/components/schemas/threads_ThreadCreatedAt'
        count:
          $ref: '#/components/schemas/Count'
          description: Number of messages in this response page.
        limit:
          $ref: '#/components/schemas/Limit'
          description: Maximum number of messages requested for this page.
        next_page_token:
          $ref: '#/components/schemas/PageToken'
          description: Token for the next, older page of messages. Omitted when this page completes the thread.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/messages_Message'
          description: Messages in this page, ordered by `timestamp` ascending. The first page contains the newest messages; follow `next_page_token` to retrieve older pages.
      required:
      - inbox_id
      - thread_id
      - labels
      - timestamp
      - senders
      - recipients
      - last_message_id
      - message_count
      - size
      - updated_at
      - created_at
      - count
      - messages
      title: Thread
    messages_MessagePreview:
      type: string
      description: Text preview of message.
      title: MessagePreview
    messages_MessageTo:
      type: array
      items:
        type: string
      description: Addresses of recipients. In format `username@domain.com` or `Display Name <username@domain.com>`.
      title: MessageTo
    After:
      type: string
      format: date-time
      description: Timestamp after which to filter by.
      title: After
    threads_ThreadSubject:
      type: string
      description: Subject of thread.
      title: ThreadSubject
    messages_MessageBcc:
      type: array
      items:
        type: string
      description: Addresses of BCC recipients. In format `username@domain.com` or `Display Name <username@domain.com>`.
      title: MessageBcc
    messages_MessageCreatedAt:
      type: string
      format: date-time
      description: Time at which message was created.
      title: MessageCreatedAt
    ErrorName:
      type: string
      description: Name of error.
      title: ErrorName
    threads_ThreadReceivedTimestamp:
      type: string
      format: date-time
      description: Timestamp of last received message.
      title: ThreadReceivedTimestamp
    ErrorMessage:
      type: string
      description: Error message.
      title: ErrorMessage
    IncludeSpam:
      type: boolean
      description: Include spam in results.
      title: IncludeSpam
    Ascending:
      type: boolean
      description: Sort in ascending temporal order.
      title: Ascending
    messages_MessageCalendarEventId:
      type: string
      description: 'The calendar event this email''s invitation was applied to: set when the email''s calendar

        invitation, update, cancellation or attendee reply changed the inbox''s calendar, a few seconds

        after the email arrives. For an email about one date of a recurring event, it is that date''s

        event ID. Absent on other emails, and on invitations that were not imported. Calendar is in

        AgentMail Labs.'
      title: MessageCalendarEventId
    threads_ThreadLabels:
      type: array
      items:
        type: string
      description: Labels of thread.
      title: ThreadLabels
    IncludeUnauthenticated:
      type: boolean
      description: Include unauthenticated in results.
      title: IncludeUnauthenticated
    threads_ThreadUpdatedAt:
      type: string
      format: date-time
      description: Time at which thread was last updated.
      title: ThreadUpdatedAt
    messages_Message:
      type: object
      properties:
        inbox_id:
          $ref: '#/components/schemas/inboxes_InboxId'
        thread_id:
          $ref: '#/components/schemas/threads_ThreadId'
        message_id:
          $ref: '#/components/schemas/messages_MessageId'
        labels:
          $ref: '#/components/schemas/messages_MessageLabels'
        timestamp:
          $ref: '#/components/schemas/messages_MessageTimestamp'
        from:
          $ref: '#/components/schemas/messages_MessageFrom'
        reply_to:
          type: array
          items:
            type: string
          description: Reply-to addresses. In format `username@domain.com` or `Display Name <username@domain.com>`.
        to:
          $ref: '#/components/schemas/messages_MessageTo'
        cc:
          $ref: '#/components/schemas/messages_MessageCc'
        bcc:
          $ref: '#/components/schemas/messages_MessageBcc'
        subject:
          $ref: '#/components/schemas/messages_MessageSubject'
        preview:
          $ref: '#/components/schemas/messages_MessagePreview'
        text:
          $ref: '#/components/schemas/messages_MessageText'
        html:
          $ref: '#/components/schemas/messages_MessageHtml'
        extracted_text:
          type: string
          description: Extracted new text content.
        extracted_html:
          type: string
          description: Extracted new HTML content.
        attachments:
          $ref: '#/components/schemas/messages_MessageAttachments'
        in_reply_to:
          $ref: '#/components/schemas/messages_MessageInReplyTo'
        calendar_event_id:
          $ref: '#/components/schemas/messages_MessageCalendarEventId'
        references:
          $ref: '#/components/schemas/messages_MessageReferences'
        headers:
          $ref: '#/components/schemas/messages_MessageHeaders'
        authentication_results:
          $ref: '#/components/schemas/messages_MessageAuthenticationResults'
        agent_armor:
          $ref: '#/components/schemas/agentArmor_AgentArmorResult'
        size:
          $ref: '#/components/schemas/messages_MessageSize'
        updated_at:
          $ref: '#/components/schemas/messages_MessageUpdatedAt'
        created_at:
          $ref: '#/components/schemas/messages_MessageCreatedAt'
      required:
      - inbox_id
      - thread_id
      - message_id
      - labels
      - timestamp
      - from
      - to
      - size
      - updated_at
      - created_at
      title: Message
    inboxes_InboxId:
      type: string
      description: The ID of the inbox.
      title: InboxId
    messages_MessageHeaders:
      type: object
      additionalProperties:
        type: string
      description: 'Headers in message. `Authentication-Results` is never included, on received or sent

        messages: the header is unsigned, so a sender can plant a forged copy. Read

        `authentication_results` for the verdicts instead. Get Raw Message still returns every copy

        of the header.'
      title: MessageHeaders
    Limit:
      type: integer
      description: Limit of number of items returned.
      title: Limit
    threads_ThreadAttachments:
      type: array
      items:
        $ref: '#/components/schemas/attachments_Attachment'
      description: Attachments in thread.
      title: ThreadAttachments
    messages_MessageHtml:
      type: string
      description: HTML body of message.
      title: MessageHtml
    threads_ThreadRecipients:
      type: array
      items:
        type: string
      description: Recipients in thread. In format `username@domain.com` or `Display Name <username@domain.com>`.
      title: ThreadRecipients
    messages_MessageId:
      type: string
      description: ID of message.
      title: MessageId
    ErrorCode:
      type: string
      description: Stable, machine-readable error code in snake_case (for example, not_found or missing_permission). Branch on this rather than the message text.
      title: ErrorCode
    attachments_AttachmentContentId:
      type: string
      description: Content ID of attachment.
      title: AttachmentContentId
    agentArmor_AgentArmorResult:
      oneOf:
      - type: object
        properties:
          status:
            type: string
            enum:
            - pending
            description: 'Discriminator value: pending'
          started_at:
            type: string
            format: date-time
            description: When the message was received. The deadline counts from here.
          deadline_at:
            type: string
            format: date-time
            description: When the scan gives up. A result still pending then reads as `unavailable` with `deadline_exceeded`.
        required:
        - status
        - started_at
        - deadline_at
      - type: object
        properties:
          status:
            type: string
            enum:
            - complete
            description: 'Discriminator value: complete'
          verdict:
            $ref: '#/components/schemas/agentArmor_AgentArmorVerdict'
          reason:
            type: string
            description: A short explanation of the verdict.
          model:
            type: string
            description: Identifies the Agent Armor release that produced the verdict. Opaque; it changes when Agent Armor is updated.
          completed_at:
            type: string
            format: date-time
            description: When the scan finished.
          manual_override:
            $ref: '#/components/schemas/agentArmor_AgentArmorManualOverride'
            description: Present on a `review` held in hold mode that someone released.
        required:
        - status
        - verdict
        - reason
        - model
        - completed_at
      - type: object
        properties:
          status:
            type: string
            enum:
            - unavailable
            description: 'Discriminator value: unavailable'
          unavailable_reason:
            $ref: '#/components/schemas/agentArmor_AgentArmorUnavailableReason'
        required:
        - status
        - unavailable_reason
      discriminator:
        propertyName: status
      description: 'Agent Armor''s result for this message. Present only on messages received while Agent Armor was on for your

        organization. A scan starts `pending` and usually completes within seconds. `message.security.completed` is

        sent only for `complete` results, so a message still `pending` at `deadline_at` reads `unavailable` with no

        event.'
      title: AgentArmorResult
    agentArmor_AgentArmorReleaseActor:
      oneOf:
      - type: object
        properties:
          kind:
            type: string
            enum:
            - api_key
            description: 'Discriminator value: api_key'
          api_key_id:
            type: string
            description: The API key that released it.
        required:
        - kind
        - api_key_id
      - type: object
        properties:
          kind:
            type: string
            enum:
            - console
            description: 'Discriminator value: console'
        required:
        - kind
      discriminator:
        propertyName: kind
      description: Who released the message.
      title: AgentArmorReleaseActor
    agentArmor_AgentArmorManualOverride:
      type: object
      properties:
        override_id:
          type: string
          description: ID of the release, and the `event_id` of its `message.security.override` event.
        actor:
          $ref: '#/components/schemas/agentArmor_AgentArmorReleaseActor'
        reason:
          type: string
          description: Why it was released, as given by whoever released it.
        original_verdict:
          type: string
          enum:
          - review
          description: The verdict that held the message.
        released_at:
          type: string
          format: date-time
          description: When it was released.
      required:
      - override_id
      - actor
      - reason
      - original_verdict
      - released_at
      description: The record of a release of a message Agent Armor held for review.
      title: AgentArmorManualOverride
    agentArmor_AgentArmorUnavailableReason:
      type: string
      enum:
      - unsupported_dsn
      - payload_too_large
      - no_scannable_content
      - enqueue_failed
      - scorer_failed
      - contract_error
      - deadline_exceeded
      description: Why no verdict is available.
      title: AgentArmorUnavailableReason
    threads_ThreadTimestamp:
      type: string
      format: date-time
      description: Timestamp of last sent or received message.
      title: ThreadTimestamp
    Labels:
      type: array
      items:
        type: string
      description: Labels to filter by.
