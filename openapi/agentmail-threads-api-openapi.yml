      title: ThreadLastMessageId
    threads_ThreadPreview:
      type: string
      description: Text preview of last message in thread.
      title: ThreadPreview
    attachments_AttachmentResponse:
      type: object
      properties:
        attachment_id:
          $ref: '#/components/schemas/attachments_AttachmentId'
        filename:
          $ref: '#/components/schemas/attachments_AttachmentFilename'
