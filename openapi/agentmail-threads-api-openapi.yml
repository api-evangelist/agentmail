        content_id:
          $ref: '#/components/schemas/attachments_AttachmentContentId'
        download_url:
          type: string
          description: Signed HTTPS CDN URL to download the attachment bytes. Retrieve a fresh URL when needed rather than storing it permanently.
        text_url:
          type: string
          description: Signed HTTPS CDN URL to download extracted plain text, when available. Omitted when no extracted text is available. Expires at the same time as download_url.
        expires_at:
          type: string
          format: date-time
          description: Time at which download_url and text_url (when present) expire. Retrieve the attachment again to obtain fresh URLs.
