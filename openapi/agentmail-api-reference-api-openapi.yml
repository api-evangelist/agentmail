            type: string
            description: The API key that released it.
        required:
        - kind
        - api_key_id
      - type: object
        properties:
          kind:
            type: string
            enum:
            - console
            description: 'Discriminator value: console'
        required:
        - kind
      discriminator:
        propertyName: kind
      description: Who released the message.
      title: AgentArmorReleaseActor
    events_MessageSecurityCompletedEvent:
