      title: MessageText
    calendar_WallTime:
      type: string
      description: 'A local wall-clock time without an offset, interpreted in the event''s `timezone`.

        Timed events use `YYYY-MM-DDTHH:mm:ss` (for example `2026-10-15T09:00:00`). All-day events use

        `YYYY-MM-DD`. Years must be between 1900 and 9999.'
      title: WallTime
    webhooks_events_SvixTimestamp:
      type: string
      format: date-time
      description: Timestamp of webhook message.
      title: SvixTimestamp
    messages_MessageCc:
      type: array
      items:
        type: string
      description: Addresses of CC recipients. In format `username@domain.com` or `Display Name <username@domain.com>`.
      title: MessageCc
    messages_MessageReferences:
      type: array
