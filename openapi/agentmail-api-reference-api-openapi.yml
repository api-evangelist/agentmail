      - agent_armor
      description: The message an Agent Armor result is for. Fetch the message for its content.
      title: MessageSecurity
    calendar_CalendarEvent:
      type: object
      properties:
        event_id:
          $ref: '#/components/schemas/calendar_CalendarEventId'
        kind:
          $ref: '#/components/schemas/calendar_CalendarEventKind'
        series_id:
          type: string
          description: For `instance` events, the UUID of the series this date belongs to.
        original_start:
          $ref: '#/components/schemas/calendar_WallTime'
          description: For `instance` events, the date's start as the series rule generated it, before any edit.
        original_start_at:
          type: string
          format: date-time
          description: For `instance` events, `original_start` as a UTC instant.
        is_exception:
          type: boolean
          description: For `instance` events, `true` when this date was edited or moved, individually or by a `mode=future` change.
        title:
          type: string
          description: Title of the event.
        description:
          type: string
          description: Description of the event. Omitted from agenda and instance list items.
        location:
          type: string
          description: Location of the event.
        metadata:
          description: Your own JSON value for the event, usually an object. Never sent to attendees. Omitted from agenda and instance list items.
        status:
          $ref: '#/components/schemas/calendar_CalendarEventStatus'
        all_day:
          type: boolean
          description: Whether this is an all-day event.
        start:
          $ref: '#/components/schemas/calendar_WallTime'
          description: Local start time in `timezone`. For all-day events, the first day.
        end:
          $ref: '#/components/schemas/calendar_WallTime'
          description: Local end time in `timezone`. For all-day events, the last day (inclusive).
        timezone:
          $ref: '#/components/schemas/calendar_IanaTimezone'
        duration_mode:
          $ref: '#/components/schemas/calendar_DurationMode'
        duration_value:
          type: integer
          description: Length of the event, in milliseconds for timed events and in days for all-day events.
        start_at:
          type: string
          format: date-time
          description: Start as a UTC instant. This is when `calendar.event.starting` is due.
        end_at:
          type: string
          format: date-time
          description: End as a UTC instant. This is when `calendar.event.ending` is due.
        recurrence:
          $ref: '#/components/schemas/calendar_Recurrence'
          description: For `series` events, the recurrence.
        attendees:
          type: array
          items:
            $ref: '#/components/schemas/calendar_Attendee'
          description: Attendees of the event. Omitted from agenda and instance list items; `attendee_count` is always present.
        attendee_count:
          type: integer
          description: Number of attendees.
        response_status:
          $ref: '#/components/schemas/calendar_AttendeeStatus'
          description: 'The inbox''s own response: the `status` of its entry in `attendees`. Present only on events

            the inbox can respond to: `email` events with an `organizer_email` and an

            `origin_message_id` that list the inbox as an attendee. Included on agenda and instance list

            items, which omit `attendees`. `needs_action` means the invitation is waiting for a reply.'
        uid:
          type: string
          description: iCalendar UID of the event. Invitations about this event carry the same UID.
        sequence:
          type: integer
          description: 'iCalendar SEQUENCE number. It increases when a change to a one-off or series event affects

            what attendees see (time, status, title, description, location, recurrence or attendees).

            A change to a dated event increases it only when the change is sent with `send_invites`.'
        source:
          $ref: '#/components/schemas/calendar_CalendarEventSource'
        organizer_email:
          type: string
          description: Email address of the organizer. For `api` events, the inbox.
        origin_message_id:
          type: string
          description: For `email` events, the ID of the message whose invitation last created or updated the event.
        resource_revision:
          $ref: '#/components/schemas/calendar_ResourceRevision'
          description: 'Present on `single` and `series` events, except agenda items and

            `calendar.event.starting` and `calendar.event.ending` payloads, which omit it.'
        created_at:
          type: string
          format: date-time
          description: Time at which the event (or, for a date, the definition governing it) was created.
        updated_at:
          type: string
          format: date-time
          description: Time at which the event (or, for a date, the definition governing it) was last updated.
        etag:
          type: string
          description: 'The event''s or date''s current version, also sent as the `ETag` response header. Send it in

            `If-Match` to make an update, delete or response conditional. Present on Get, Create,

            Update, Delete and Respond responses; list items and webhooks omit it. Treat it as opaque:

            a dated event''s `etag` (`"occ-..."`) is not derived from `resource_revision`.'
      required:
      - event_id
      - kind
      - title
      - status
      - all_day
      - start
      - end
      - timezone
      - duration_mode
      - duration_value
      - start_at
      - end_at
      - attendee_count
      - uid
      - sequence
      - source
      - created_at
      - updated_at
      description: 'A calendar event. The same shape is used by every response, list item and webhook. `kind` says

        whether it is a one-off event, the definition of a recurring series, or one date of a series.'
      title: CalendarEvent
    agentArmor_AgentArmorCompletedEventResult:
      type: object
      properties:
        verdict:
          $ref: '#/components/schemas/agentArmor_AgentArmorVerdict'
        reason:
          type: string
          description: A short explanation of the verdict.
        model:
          type: string
          description: Identifies the Agent Armor release that produced the verdict. Opaque; it changes when Agent Armor is updated.
        completed_at:
          type: string
          format: date-time
          description: When the scan finished.
        manual_override:
          $ref: '#/components/schemas/agentArmor_AgentArmorManualOverride'
          description: Present on a `review` held in hold mode that someone released.
        status:
          type: string
          enum:
          - complete
      required:
      - verdict
      - reason
      - model
      - completed_at
      - status
      description: The result in a `message.security.completed` or `message.security.review` event, which is always `complete`.
      title: AgentArmorCompletedEventResult
    domains_Domain:
      type: object
      properties:
        pod_id:
          $ref: '#/components/schemas/pods_PodId'
        domain_id:
          $ref: '#/components/schemas/domains_DomainId'
        domain:
          $ref: '#/components/schemas/domains_DomainName'
        status:
          $ref: '#/components/schemas/domains_Status'
        reason:
          type: string
          description: 'Why the domain is not (yet) VERIFIED, when known. `dns_records_missing` / `dns_records_invalid` point at the DNS records. The `ses_*` values mean the records look right and sending-infrastructure validation has not converged: `ses_dkim_pending` / `ses_mail_from_pending` (still checking), `ses_dkim_temporary_failure` / `ses_mail_from_temporary_failure` (a transient error the infrastructure keeps retrying on its own — usually resolves without changes), `ses_dkim_failed` / `ses_mail_from_failed` (a terminal verdict; re-verify after fixing), `ses_dkim_not_started` / `ses_mail_from_not_started` (the attribute was never configured on the identity — re-verify to push it), and `ses_not_verified_for_sending`. Absent when VERIFIED.'
        feedback_enabled:
          $ref: '#/components/schemas/domains_FeedbackEnabled'
        inbound_enabled:
          $ref: '#/components/schemas/domains_InboundEnabled'
          description: Absent on domains created before this field existed; those receive email.
        subdomains_enabled:
          $ref: '#/components/schemas/domains_SubdomainsEnabled'
        tracking_enabled:
          $ref: '#/components/schemas/domains_TrackingEnabled'
        records:
          type: array
          items:
            $ref: '#/components/schemas/domains_VerificationRecord'
          description: 'A list of DNS records required to verify the domain. Includes the apex

            MX record unless `inbound_enabled` is false, and a wildcard MX record

            (`*.<domain>`) when `subdomains_enabled` is true.'
        client_id:
          $ref: '#/components/schemas/domains_ClientId'
        updated_at:
          type: string
          format: date-time
          description: Time at which the domain was last updated.
        created_at:
          type: string
          format: date-time
          description: Time at which the domain was created.
      required:
      - domain_id
      - domain
      - status
      - feedback_enabled
      - subdomains_enabled
      - tracking_enabled
      - records
      - updated_at
      - created_at
      title: Domain
    threads_ThreadSentTimestamp:
      type: string
      format: date-time
      description: Timestamp of last sent message.
      title: ThreadSentTimestamp
    domains_RecordType:
      type: string
      enum:
      - TXT
      - CNAME
      - MX
      title: RecordType
    events_MessageBouncedEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - event
        event_type:
          type: string
          enum:
          - message.bounced
        event_id:
          $ref: '#/components/schemas/events_EventId'
        bounce:
          $ref: '#/components/schemas/events_Bounce'
      required:
      - type
      - event_type
