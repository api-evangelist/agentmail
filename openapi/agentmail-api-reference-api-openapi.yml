      title: RecurrenceDate
    messages_MessageAuthenticationVerdict:
      type: string
      enum:
      - pass
      - fail
      - none
      - neutral
      - softfail
      - temperror
      - permerror
      description: 'Result of one email authentication mechanism, in the vocabulary of the

        `Authentication-Results` header (RFC 8601). `none` means there was nothing to evaluate

        (Amazon SES calls this GRAY): no SPF record for the envelope MAIL FROM domain, no DKIM

        signature to check, or no DMARC record for the From domain.'
      title: MessageAuthenticationVerdict
