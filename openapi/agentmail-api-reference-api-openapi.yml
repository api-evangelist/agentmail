components:
  schemas:
    threads_ThreadSize:
      type: integer
      description: Size of thread in bytes.
      title: ThreadSize
    domains_FeedbackEnabled:
      type: boolean
      description: Bounce and complaint notifications are sent to your inboxes.
      title: FeedbackEnabled
    messages_MessageAuthenticationResults:
      type: object
      properties:
        spf:
          $ref: '#/components/schemas/messages_MessageAuthenticationVerdict'
        dkim:
          $ref: '#/components/schemas/messages_MessageAuthenticationVerdict'
        dmarc:
          $ref: '#/components/schemas/messages_MessageAuthenticationVerdict'
        spf_domain:
          $ref: '#/components/schemas/messages_MessageAuthenticationDomain'
          description: Envelope MAIL FROM domain the `spf` verdict is about (`smtp.mailfrom`).
        dkim_domain:
          $ref: '#/components/schemas/messages_MessageAuthenticationDomain'
          description: 'Signing domain the `dkim` verdict is about (`header.d`). Present only when `dkim` is

            `pass` or `fail`.'
        dmarc_domain:
          $ref: '#/components/schemas/messages_MessageAuthenticationDomain'
          description: From domain the `dmarc` verdict is about (`header.from`).
        arc_sealer:
          $ref: '#/components/schemas/messages_MessageAuthenticationDomain'
          description: 'Domain of the trusted forwarder whose ARC seal the verdicts were taken from, such as

            `google.com`. Present only on forwarded mail, and only beside at least one verdict.'
      description: "Per-mechanism SPF, DKIM, and DMARC verdicts for a received message, each with the domain it\nis about, kept only where they speak for the sender's From identity. A verdict that could\nnot be computed is absent, so the field can be `{}`. The field is absent on sent messages\nand on messages received before 2026-09-09; the `*_domain` and `arc_sealer` keys appear on\nmessages received after they were introduced.\n\nThe verdicts are the ones Amazon SES computed when the message reached AgentMail, with one\nexception. Forwarded mail fails DMARC at the receiving hop by construction. When AgentMail\ndelivers a forwarded message as authenticated because a trusted forwarder (such as Google or\nMicrosoft) sealed a valid ARC chain vouching for the original, the field reports the\nverdicts that forwarder recorded for the original message, and `arc_sealer` names it.\n\n- `spf` is about the envelope MAIL FROM (Return-Path) domain, named in `spf_domain`. It is\n  present only when that domain is aligned with the sender's domain (the From mailbox, or\n  the Sender header when From spans domains), meaning the two share an organizational\n  domain: `mail.example.com` is aligned with `example.com`. An unaligned SPF result is\n  withheld whatever its value.\n- `dkim` is the DKIM verdict, and `dkim_domain` the signing domain (the `d=` tag). On\n  directly received mail the domain is named only when every DKIM signature on the message\n  is from the same domain; a message signed by more than one domain (a sender and its email\n  provider, for instance) keeps the verdict and omits the domain. `dkim_domain` is the\n  signing domain as written, so compare it with the From domain before relying on it.\n- `dmarc` is the DMARC verdict for the From domain, named in `dmarc_domain`.\n- `dkim` and `dmarc` are withheld when the From list spans more than one domain or could not\n  be fully parsed.\n- On forwarded mail each sealed verdict is reported only when the domain the forwarder\n  recorded it for matches the message's current From domain. If the forwarder rewrote From,\n  or vouched for nothing, the field is `{}`.\n\nThe `unauthenticated` label, not this field, is AgentMail's acceptance decision, and it uses\na looser rule, so the two can disagree: a single-From message whose only pass is an\nunaligned envelope SPF is delivered without the label while this field shows no pass. Use\nthe label to tell whether AgentMail accepted the message as legitimate, and this field to\nsee which domain each mechanism authenticated. Do not reject mail on `dmarc: fail` alone."
      title: MessageAuthenticationResults
    events_Open:
      type: object
      properties:
        inbox_id:
          $ref: '#/components/schemas/inboxes_InboxId'
        thread_id:
          $ref: '#/components/schemas/threads_ThreadId'
        message_id:
          $ref: '#/components/schemas/messages_MessageId'
        timestamp:
          $ref: '#/components/schemas/events_Timestamp'
      required:
      - inbox_id
      - thread_id
      - message_id
      - timestamp
      title: Open
    events_MessageSentEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - event
        event_type:
          type: string
          enum:
          - message.sent
        event_id:
          $ref: '#/components/schemas/events_EventId'
        send:
          $ref: '#/components/schemas/events_Send'
      required:
      - type
      - event_type
      - event_id
      - send
      title: MessageSentEvent
    messages_MessageInReplyTo:
      type: string
      description: ID of message being replied to.
      title: MessageInReplyTo
    calendar_ResourceRevision:
      type: integer
      description: 'Revision of the resource. It increases on every change. The resource''s `etag` is

        `"rv-<resource_revision>"`.'
      title: ResourceRevision
    domains_DomainId:
      type: string
      description: The ID of the domain.
      title: DomainId
    events_ReceivedMessage:
      type: object
      properties:
        inbox_id:
          $ref: '#/components/schemas/inboxes_InboxId'
        thread_id:
          $ref: '#/components/schemas/threads_ThreadId'
        message_id:
          $ref: '#/components/schemas/messages_MessageId'
        labels:
          $ref: '#/components/schemas/messages_MessageLabels'
        timestamp:
          $ref: '#/components/schemas/messages_MessageTimestamp'
        from:
          $ref: '#/components/schemas/messages_MessageFrom'
        reply_to:
          type: array
          items:
            type: string
          description: Reply-to addresses. In format `username@domain.com` or `Display Name <username@domain.com>`.
        to:
          $ref: '#/components/schemas/messages_MessageTo'
        cc:
          $ref: '#/components/schemas/messages_MessageCc'
        bcc:
          $ref: '#/components/schemas/messages_MessageBcc'
        subject:
          $ref: '#/components/schemas/messages_MessageSubject'
        preview:
          $ref: '#/components/schemas/messages_MessagePreview'
        text:
          $ref: '#/components/schemas/messages_MessageText'
        html:
          $ref: '#/components/schemas/messages_MessageHtml'
        extracted_text:
          type: string
          description: Extracted new text content.
        extracted_html:
          type: string
          description: Extracted new HTML content.
        attachments:
          $ref: '#/components/schemas/messages_MessageAttachments'
        in_reply_to:
          $ref: '#/components/schemas/messages_MessageInReplyTo'
        calendar_event_id:
          $ref: '#/components/schemas/messages_MessageCalendarEventId'
        references:
          $ref: '#/components/schemas/messages_MessageReferences'
        headers:
          $ref: '#/components/schemas/messages_MessageHeaders'
        authentication_results:
          $ref: '#/components/schemas/messages_MessageAuthenticationResults'
        agent_armor:
          $ref: '#/components/schemas/agentArmor_AgentArmorResult'
        size:
          $ref: '#/components/schemas/messages_MessageSize'
        updated_at:
          $ref: '#/components/schemas/messages_MessageUpdatedAt'
        created_at:
          $ref: '#/components/schemas/messages_MessageCreatedAt'
        body_url:
          type: string
          description: 'Pre-signed URL that downloads the stored body as a JSON object including `text`, `html`,

            `extracted_text`, and `extracted_html`. Present only when the body is omitted from the event.

            Valid until `body_expires_at`, one hour after the event was built. The body stays available

            through the get message endpoint after the URL expires.'
        body_expires_at:
          type: string
          format: date-time
          description: Time at which `body_url` expires. Present only with `body_url`.
      required:
      - inbox_id
      - thread_id
      - message_id
      - labels
      - timestamp
      - from
      - to
      - size
      - updated_at
      - created_at
      description: 'The received message. The body (`text`, `html`, `extracted_text`, and `extracted_html`) is included

        inline only when it is small enough. Webhooks omit it when the stored body is larger than 64 KiB;

        WebSocket events also omit it when the serialized event would be larger than 30 KiB. When the body

        is omitted, `body_url` and `body_expires_at` are set instead.'
      title: ReceivedMessage
    messages_MessagePreview:
      type: string
      description: Text preview of message.
      title: MessagePreview
    messages_MessageTo:
      type: array
      items:
        type: string
      description: Addresses of recipients. In format `username@domain.com` or `Display Name <username@domain.com>`.
      title: MessageTo
    threads_ThreadSubject:
      type: string
      description: Subject of thread.
      title: ThreadSubject
    messages_MessageBcc:
      type: array
      items:
        type: string
      description: Addresses of BCC recipients. In format `username@domain.com` or `Display Name <username@domain.com>`.
      title: MessageBcc
    calendar_CalendarEventStatus:
      type: string
      enum:
      - confirmed
      - tentative
      - cancelled
      description: 'Status of the event. A `cancelled` event or date stays readable but sends no

        `calendar.event.starting` or `calendar.event.ending` webhooks (cancelling a date that is

        already running still sends its `calendar.event.ending`). A date cancelled by deleting its

        dated ID is removed from the series instead, so reading it can return `404` or `410`.'
      title: CalendarEventStatus
    domains_SubdomainsEnabled:
      type: boolean
      description: 'Allow inboxes on any subdomain of this domain. Adds a required wildcard MX

        record (`*.<domain>`) to `records`.'
      title: SubdomainsEnabled
    events_Reject:
      type: object
      properties:
        inbox_id:
          $ref: '#/components/schemas/inboxes_InboxId'
        thread_id:
          $ref: '#/components/schemas/threads_ThreadId'
        message_id:
          $ref: '#/components/schemas/messages_MessageId'
        timestamp:
          $ref: '#/components/schemas/events_Timestamp'
        reason:
          type: string
          description: Reject reason.
      required:
      - inbox_id
      - thread_id
      - message_id
      - timestamp
      - reason
      title: Reject
    webhooks_events_SvixSignature:
      type: string
      description: Signature of webhook message.
      title: SvixSignature
    domains_ClientId:
      type: string
      description: Client ID of domain.
      title: ClientId
    messages_MessageCreatedAt:
      type: string
      format: date-time
      description: Time at which message was created.
      title: MessageCreatedAt
    domains_VerificationStatus:
      type: string
      enum:
      - NOT_STARTED
      - PENDING
      - INVALID
      - FAILED
      - VERIFYING
      - VERIFIED
      title: VerificationStatus
    events_MessageOpenedEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - event
        event_type:
          type: string
          enum:
          - message.opened
        event_id:
          $ref: '#/components/schemas/events_EventId'
        open:
          $ref: '#/components/schemas/events_Open'
      required:
      - type
      - event_type
      - event_id
      - open
      description: 'A tracked message was opened for the first time. Sent once per message: repeat opens do not

        resend it.'
      title: MessageOpenedEvent
    domains_VerificationRecord:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/domains_RecordType'
          description: The type of the DNS record.
        name:
          type: string
          description: The name or host of the record.
        value:
          type: string
          description: The value of the record.
        status:
          $ref: '#/components/schemas/domains_RecordStatus'
          description: The verification status of this specific record.
        priority:
          type: integer
          description: The priority of the MX record.
        reason:
          type: string
          description: Why the record is INVALID, when known. `duplicate_records` means the expected value is present but extra records coexist at the same name; `value_mismatch` means a record exists but does not match the expected value.
      required:
      - type
      - name
      - value
      - status
      title: VerificationRecord
    calendar_IanaTimezone:
      type: string
      description: 'Canonical IANA time zone name, for example `America/New_York`, `Europe/London` or `UTC`.

        Abbreviations such as `PST`, Windows names such as `Pacific Standard Time`, and spellings that

        differ from the canonical name are rejected.'
      title: IanaTimezone
    domains_InboundEnabled:
      type: boolean
      description: 'Receive email for this domain. Defaults to `true`. Set `false` for a send-only

        domain: the apex MX record is not required and is omitted from `records`, so the

        domain''s existing email provider keeps receiving its mail. Inboxes on a send-only

        domain can still send.'
      title: InboundEnabled
    events_MessageSecurityReviewEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - event
        event_type:
          type: string
          enum:
          - message.security.review
        event_id:
          $ref: '#/components/schemas/events_EventId'
        message:
          $ref: '#/components/schemas/events_MessageSecurity'
      required:
      - type
      - event_type
      - event_id
      - message
      description: 'In hold mode, Agent Armor held a received message for review: your agents are not sent its `message.received`

        until someone releases it. The message carries the `agent-armor-held` label until then. Sent once per message and

        inbox; `event_id` is stable. Not sent for messages labeled `spam`, `blocked`, `unauthenticated`, or `trash`: list

        held mail by the `agent-armor-held` label instead.'
      title: MessageSecurityReviewEvent
    events_CalendarEventDeletedEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - event
        event_type:
          type: string
          enum:
          - calendar.event.deleted
        event_id:
          $ref: '#/components/schemas/events_EventId'
          description: Equals the `deletion_id` returned by the request that made the change.
        inbox_id:
          $ref: '#/components/schemas/inboxes_InboxId'
        calendar_event:
          $ref: '#/components/schemas/calendar_CalendarEvent'
      required:
      - type
      - event_type
      - event_id
      - inbox_id
      - calendar_event
      description: 'A one-off or recurring event was deleted. `calendar_event` is the event as it was. Cancelling

        dates of a recurring event sends `calendar.event.updated` instead.'
      title: CalendarEventDeletedEvent
    threads_ThreadReceivedTimestamp:
      type: string
      format: date-time
      description: Timestamp of last received message.
      title: ThreadReceivedTimestamp
    events_CalendarEventEndingEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - event
        event_type:
          type: string
          enum:
          - calendar.event.ending
        event_id:
          $ref: '#/components/schemas/events_EventId'
          description: Stable for this date and boundary. Use it to deduplicate deliveries.
        inbox_id:
          $ref: '#/components/schemas/inboxes_InboxId'
        calendar_event:
          $ref: '#/components/schemas/calendar_CalendarEvent'
          description: The event or date as it stood when the boundary was first processed.
        scheduled_at:
          type: string
          format: date-time
          description: The end this webhook is for (the event's `end_at`).
      required:
      - type
      - event_type
      - event_id
      - inbox_id
      - calendar_event
      - scheduled_at
      description: 'An event, or one date of a recurring event, has ended. Usually sent within a minute after

        `scheduled_at`. Retries carry the same `event_id` and an identical body.'
      title: CalendarEventEndingEvent
    calendar_CalendarEventSource:
      type: string
      enum:
      - api
      - email
      description: 'Where the event came from. `api` events were created through this API and the inbox is their

        organizer. `email` events were created from a calendar invitation (iMIP) received by the inbox;

        their organizer is the sender of the invitation.'
      title: CalendarEventSource
    events_CalendarEventCreatedEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - event
        event_type:
          type: string
          enum:
          - calendar.event.created
        event_id:
          $ref: '#/components/schemas/events_EventId'
          description: Equals the `operation_id` returned by the request that made the change.
        inbox_id:
          $ref: '#/components/schemas/inboxes_InboxId'
        calendar_event:
          $ref: '#/components/schemas/calendar_CalendarEvent'
      required:
      - type
      - event_type
      - event_id
      - inbox_id
      - calendar_event
      description: 'An event was created, through the API or from an invitation the inbox received. Also sent when

        one date of a recurring event is edited for the first time; `calendar_event` is then that date.'
      title: CalendarEventCreatedEvent
    calendar_RecurrencePeriod:
      type: object
      properties:
        start:
          $ref: '#/components/schemas/calendar_WallTime'
        end:
          $ref: '#/components/schemas/calendar_WallTime'
        duration:
          type: string
          description: ISO 8601 duration, for example `PT30M`.
      required:
      - start
      description: An extra date (RDATE) given as a period. Specify exactly one of `end` or `duration`.
      title: RecurrencePeriod
    events_Bounce:
      type: object
      properties:
        inbox_id:
          $ref: '#/components/schemas/inboxes_InboxId'
        thread_id:
          $ref: '#/components/schemas/threads_ThreadId'
        message_id:
          $ref: '#/components/schemas/messages_MessageId'
        timestamp:
          $ref: '#/components/schemas/events_Timestamp'
        type:
          type: string
          description: Bounce type.
        sub_type:
          type: string
          description: Bounce sub-type.
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/events_Recipient'
          description: Bounced recipients.
      required:
      - inbox_id
      - thread_id
      - message_id
      - timestamp
      - type
      - sub_type
      - recipients
      title: Bounce
    messages_MessageCalendarEventId:
      type: string
      description: 'The calendar event this email''s invitation was applied to: set when the email''s calendar

        invitation, update, cancellation or attendee reply changed the inbox''s calendar, a few seconds

        after the email arrives. For an email about one date of a recurring event, it is that date''s

        event ID. Absent on other emails, and on invitations that were not imported. Calendar is in

        AgentMail Labs.'
      title: MessageCalendarEventId
    threads_ThreadLabels:
      type: array
      items:
        type: string
      description: Labels of thread.
      title: ThreadLabels
    threads_ThreadUpdatedAt:
      type: string
      format: date-time
      description: Time at which thread was last updated.
      title: ThreadUpdatedAt
    OrganizationId:
      type: string
      description: ID of organization.
      title: OrganizationId
    events_EventId:
      type: string
      description: 'ID of the event. It is the same on every retry and redelivery of the event and on every webhook

        or WebSocket subscription that receives it, so use it to deduplicate. The format varies by event

        type; treat it as an opaque string.'
      title: EventId
    inboxes_InboxId:
      type: string
      description: The ID of the inbox.
      title: InboxId
    events_Recipient:
      type: object
      properties:
        address:
          type: string
          description: Recipient address.
        status:
          type: string
          description: Recipient status.
      required:
      - address
      - status
      title: Recipient
    calendar_CalendarEventId:
      type: string
      description: 'ID of a calendar event. A one-off or recurring event is addressed by its UUID. One date of a

        recurring event is addressed by a dated ID, `<uuid>_<slot>`: `<uuid>_t20261015T090000` for a

        timed date (the original wall-clock start in the event''s time zone) or `<uuid>_d20261015` for an

        all-day date. Dated IDs are stable: moving a date keeps its original ID.'
      title: CalendarEventId
    messages_MessageHeaders:
      type: object
      additionalProperties:
        type: string
      description: 'Headers in message. `Authentication-Results` is never included, on received or sent

        messages: the header is unsigned, so a sender can plant a forged copy. Read

        `authentication_results` for the verdicts instead. Get Raw Message still returns every copy

        of the header.'
      title: MessageHeaders
    threads_ThreadAttachments:
      type: array
      items:
        $ref: '#/components/schemas/attachments_Attachment'
      description: Attachments in thread.
      title: ThreadAttachments
    messages_MessageHtml:
      type: string
      description: HTML body of message.
      title: MessageHtml
    messages_MessageId:
      type: string
      description: ID of message.
      title: MessageId
    threads_ThreadRecipients:
      type: array
      items:
        type: string
      description: Recipients in thread. In format `username@domain.com` or `Display Name <username@domain.com>`.
      title: ThreadRecipients
    events_MessageSecurityOverride:
      type: object
      properties:
        organization_id:
          $ref: '#/components/schemas/OrganizationId'
        inbox_id:
          $ref: '#/components/schemas/inboxes_InboxId'
        message_id:
          $ref: '#/components/schemas/messages_MessageId'
        manual_override:
          $ref: '#/components/schemas/agentArmor_AgentArmorManualOverride'
      required:
      - organization_id
      - inbox_id
      - message_id
      - manual_override
      description: The message someone released, and the record of the release. Fetch the message for its content.
      title: MessageSecurityOverride
    attachments_AttachmentContentId:
      type: string
      description: Content ID of attachment.
      title: AttachmentContentId
    events_MessageSecurityOverrideEvent:
      type: object
      properties:
        type:
          type: string
          enum:
          - event
        event_type:
          type: string
          enum:
          - message.security.override
        event_id:
          $ref: '#/components/schemas/events_EventId'
        message:
          $ref: '#/components/schemas/events_MessageSecurityOverride'
      required:
      - type
      - event_type
      - event_id
      - message
      description: 'Someone released a message Agent Armor held for review. Its `message.received` is sent to your agents as well,

        and the two can arrive in either order.

        Sent once per message and inbox; `event_id` is stable. Not sent for messages labeled `spam`, `blocked`,

        `unauthenticated`, or `trash`.'
      title: MessageSecurityOverrideEvent
    agentArmor_AgentArmorResult:
      oneOf:
      - type: object
        properties:
          status:
            type: string
            enum:
            - pending
            description: 'Discriminator value: pending'
          started_at:
            type: string
            format: date-time
            description: When the message was received. The deadline counts from here.
          deadline_at:
            type: string
            format: date-time
            description: When the scan gives up. A result still pending then reads as `unavailable` with `deadline_exceeded`.
        required:
        - status
        - started_at
        - deadline_at
      - type: object
        properties:
          status:
            type: string
            enum:
            - complete
            description: 'Discriminator value: complete'
          verdict:
            $ref: '#/components/schemas/agentArmor_AgentArmorVerdict'
          reason:
            type: string
            description: A short explanation of the verdict.
          model:
            type: string
            description: Identifies the Agent Armor release that produced the verdict. Opaque; it changes when Agent Armor is updated.
          completed_at:
            type: string
            format: date-time
            description: When the scan finished.
          manual_override:
            $ref: '#/components/schemas/agentArmor_AgentArmorManualOverride'
            description: Present on a `review` held in hold mode that someone released.
        required:
