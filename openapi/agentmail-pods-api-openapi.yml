openapi: 3.2.0
info:
  title: Reference Pods API
  version: 1.0.0
servers:
- url: https://api.agentmail.to
  description: prod
- url: https://x402.api.agentmail.to
  description: prod-x402
- url: https://mpp.api.agentmail.to
  description: prod-mpp
- url: https://api.agentmail.eu
  description: eu-prod
tags:
- name: Pods
paths:
  /v0/pods:
    get:
      operationId: pods_list
      summary: List Pods
      description: '**CLI:**

        ```bash

        agentmail pods list

        ```'
      tags:
      - Pods
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Limit'
      - name: page_token
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PageToken'
      - name: ascending
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Ascending'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pods_ListPodsResponse'
      security:
      - Bearer: []
    post:
      operationId: pods_create
      summary: Create Pod
      description: '**CLI:**

        ```bash

        agentmail pods create --client-id my-pod

        ```'
      tags:
      - Pods
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pods_Pod'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pods_CreatePodRequest'
      security:
      - Bearer: []
  /v0/pods/{pod_id}:
    get:
      operationId: pods_get
      summary: Get Pod
      description: '**CLI:**

        ```bash

        agentmail pods get --pod-id

        ```'
      tags:
      - Pods
      parameters:
      - name: pod_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/pods_PodId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pods_Pod'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
    delete:
      operationId: pods_delete
      summary: Delete Pod
      description: '**CLI:**

        ```bash

        agentmail pods delete --pod-id

        ```'
      tags:
      - Pods
      parameters:
      - name: pod_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/pods_PodId'
      responses:
        '200':
          description: Successful response
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
components:
  schemas:
    ErrorName:
      type: string
      description: Name of error.
      title: ErrorName
    ErrorFix:
      type: string
      description: The concrete next action that resolves the error.
      title: ErrorFix
    ErrorMessage:
      type: string
      description: Error message.
      title: ErrorMessage
    pods_ClientId:
      type: string
      description: Client ID of pod.
      title: ClientId
    pods_Name:
      type: string
      description: Name of pod.
      title: Name
    pods_Pod:
      type: object
      properties:
        pod_id:
          $ref: '#/components/schemas/pods_PodId'
        name:
          $ref: '#/components/schemas/pods_Name'
        updated_at:
          type: string
          format: date-time
          description: Time at which pod was last updated.
        created_at:
          type: string
          format: date-time
          description: Time at which pod was created.
        client_id:
          $ref: '#/components/schemas/pods_ClientId'
      required:
      - pod_id
      - name
      - updated_at
      - created_at
      title: Pod
    ErrorCode:
      type: string
      description: Stable, machine-readable error code in snake_case (for example, not_found or missing_permission). Branch on this rather than the message text.
      title: ErrorCode
    pods_PodId:
      type: string
      description: ID of pod.
      title: PodId
    Count:
      type: integer
      description: Number of items returned.
      title: Count
    Ascending:
      type: boolean
      description: Sort in ascending temporal order.
      title: Ascending
    PageToken:
      type: string
      description: Page token for pagination.
      title: PageToken
    pods_ListPodsResponse:
      type: object
      properties:
        count:
          $ref: '#/components/schemas/Count'
        limit:
          $ref: '#/components/schemas/Limit'
        next_page_token:
          $ref: '#/components/schemas/PageToken'
        pods:
          type: array
          items:
            $ref: '#/components/schemas/pods_Pod'
          description: Ordered by `created_at` descending.
      required:
      - count
      - pods
      title: ListPodsResponse
    pods_CreatePodRequest:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/pods_Name'
        client_id:
          $ref: '#/components/schemas/pods_ClientId'
      title: CreatePodRequest
    ErrorResponse:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/ErrorName'
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/ErrorMessage'
        fix:
          $ref: '#/components/schemas/ErrorFix'
        docs:
          $ref: '#/components/schemas/ErrorDocs'
      required:
      - name
      - message
      title: ErrorResponse
    ErrorDocs:
      type: string
      description: Link to the error reference entry for this code.
      title: ErrorDocs
    Limit:
      type: integer
      description: Limit of number of items returned.
      title: Limit
    ValidationErrorResponse:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/ErrorName'
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/ErrorMessage'
        errors:
          description: Validation errors. Each entry has a path and a message identifying the invalid field.
        fix:
          $ref: '#/components/schemas/ErrorFix'
        docs:
          $ref: '#/components/schemas/ErrorDocs'
      required:
      - name
      - errors
      title: ValidationErrorResponse
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
