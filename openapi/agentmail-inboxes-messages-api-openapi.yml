            - complete
            description: 'Discriminator value: complete'
          verdict:
            $ref: '#/components/schemas/agentArmor_AgentArmorVerdict'
          reason:
            type: string
            description: A short explanation of the verdict.
          model:
            type: string
            description: Identifies the Agent Armor release that produced the verdict. Opaque; it changes when Agent Armor is updated.
          completed_at:
            type: string
            format: date-time
            description: When the scan finished.
          manual_override:
            $ref: '#/components/schemas/agentArmor_AgentArmorManualOverride'
            description: Present on a `review` held in hold mode that someone released.
        required:
        - status
        - verdict
        - reason
        - model
        - completed_at
      - type: object
        properties:
          status:
            type: string
            enum:
            - unavailable
            description: 'Discriminator value: unavailable'
          unavailable_reason:
            $ref: '#/components/schemas/agentArmor_AgentArmorUnavailableReason'
        required:
        - status
        - unavailable_reason
      discriminator:
        propertyName: status
      description: 'Agent Armor''s result for this message. Present only on messages received while Agent Armor was on for your

        organization. A scan starts `pending` and usually completes within seconds. `message.security.completed` is

        sent only for `complete` results, so a message still `pending` at `deadline_at` reads `unavailable` with no

        event.'
      title: AgentArmorResult
