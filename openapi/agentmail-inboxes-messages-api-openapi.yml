openapi: 3.2.0
info:
  title: Reference inboxes > messages API
  version: 1.0.0
servers:
- url: https://api.agentmail.to
  description: prod
- url: https://x402.api.agentmail.to
  description: prod-x402
- url: https://mpp.api.agentmail.to
  description: prod-mpp
- url: https://api.agentmail.eu
  description: eu-prod
tags:
- name: inboxes > messages
paths:
  /v0/inboxes/{inbox_id}/messages:
    get:
      operationId: inboxes_messages_list
      summary: List Messages
      description: 'Lists messages in the inbox, most recent first. Pass `from`, `to`, or

        `subject` to filter by substring. Filtered requests are served by

        search, which caps `limit` at 100. For relevance-ranked full-text

        search across sender, recipients, subject, and message body, use

        `Search Messages`.


        **CLI:**

        ```bash

        agentmail inboxes messages list --inbox-id

        ```'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      - name: limit
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Limit'
      - name: page_token
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PageToken'
      - name: labels
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Labels'
      - name: before
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Before'
      - name: after
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/After'
      - name: ascending
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Ascending'
      - name: include_spam
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/IncludeSpam'
      - name: include_blocked
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/IncludeBlocked'
      - name: include_unauthenticated
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/IncludeUnauthenticated'
      - name: include_trash
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/IncludeTrash'
      - name: from
        in: query
        description: Filter to messages whose sender contains this value (substring match). Repeatable; all values must match.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: to
        in: query
        description: Filter to messages whose recipients (to, cc, or bcc) contain this value (substring match). Repeatable; all values must match.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: subject
        in: query
        description: Filter to messages whose subject contains this value (substring match). Repeatable; all values must match.
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages_ListMessagesResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
  /v0/inboxes/{inbox_id}/messages/search:
    get:
      operationId: inboxes_messages_search
      summary: Search Messages
      description: 'Full-text search across messages in the inbox, ranked by relevance. The

        query is matched against the sender, recipients, and subject (substring)

        and the message body (tokenized full text). Spam, trash, blocked, and

        unauthenticated messages are always excluded. `limit` cannot exceed 100.'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      - name: q
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Query'
      - name: limit
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Limit'
      - name: page_token
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PageToken'
      - name: before
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Before'
      - name: after
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/After'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages_SearchMessagesResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
  /v0/inboxes/{inbox_id}/messages/{message_id}:
    get:
      operationId: inboxes_messages_get
      summary: Get Message
      description: '**CLI:**

        ```bash

        agentmail inboxes messages get --inbox-id --message-id

        ```'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      - name: message_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/messages_MessageId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages_Message'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
    patch:
      operationId: inboxes_messages_update
      summary: Update Message
      description: '**CLI:**

        ```bash

        agentmail inboxes messages update --inbox-id --message-id --add-labels read --remove-labels unread

        ```'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      - name: message_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/messages_MessageId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages_UpdateMessageResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/messages_UpdateMessageRequest'
      security:
      - Bearer: []
    delete:
      operationId: inboxes_messages_delete
      summary: Delete Message
      description: 'Permanently deletes a message.


        **CLI:**

        ```bash

        agentmail inboxes messages delete --inbox-id --message-id

        ```'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      - name: message_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/messages_MessageId'
      responses:
        '200':
          description: Successful response
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
  /v0/inboxes/{inbox_id}/messages/{message_id}/agent-armor/feedback:
    post:
      operationId: inboxes_messages_createAgentArmorFeedback
      summary: Create Agent Armor Feedback
      description: 'Tell us whether Agent Armor''s verdict on a message was right. The message needs a completed result. A message

        accepts up to 20 pieces of feedback. Requires permission to read the message.'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      - name: message_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/messages_MessageId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentArmor_AgentArmorFeedback'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentArmor_CreateAgentArmorFeedbackRequest'
      security:
      - Bearer: []
  /v0/inboxes/{inbox_id}/messages/{message_id}/agent-armor/release:
    post:
      operationId: inboxes_messages_releaseAgentArmorMessage
      summary: Release Agent Armor Message
      description: 'Release a message Agent Armor held for review in hold mode: your agents are sent its `message.received`

        event, `message.security.override` is sent too, in either order, and its `agent-armor-held` label is removed.

        Only a message whose verdict is `review` and that is still held can be released; anything else answers `409`.

        Repeating a release with the same reason and the same API key returns the first release; any other repeat

        answers `409`.


        Requires the opt-in `agent_armor_release` permission and permission to read the message. An organization

        admin can also release from the console.'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      - name: message_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/messages_MessageId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agentArmor_ReleaseAgentArmorMessageResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agentArmor_ReleaseAgentArmorMessageRequest'
      security:
      - Bearer: []
  /v0/inboxes/{inbox_id}/messages/batch-get:
    post:
      operationId: inboxes_messages_batchGet
      summary: Batch Get Messages
      description: 'Fetch metadata for up to 500 messages in one request. Missing or

        restricted IDs are silently omitted; compare `count` against `limit`

        to detect misses.


        **CLI:**

        ```bash

        agentmail inboxes messages batch-get --inbox-id --message-ids --message-ids

        ```'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages_BatchGetMessagesResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/messages_BatchGetMessagesRequest'
      security:
      - Bearer: []
  /v0/inboxes/{inbox_id}/messages/batch-update:
    post:
      operationId: inboxes_messages_batchUpdate
      summary: Batch Update Messages
      description: 'Apply one label change to up to 50 messages in a single request. The

        same add_labels and remove_labels apply to every message id, and at

        least one of them must be provided. The update is atomic: either all

        resolved messages are updated or none are. Missing or restricted ids

        are silently excluded; compare `count` against `limit` to detect

        exclusions.


        **CLI:**

        ```bash

        agentmail inboxes messages batch-update --inbox-id --message-ids --message-ids --add-labels read --remove-labels unread

        ```'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages_BatchUpdateMessagesResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/messages_BatchUpdateMessagesRequest'
      security:
      - Bearer: []
  /v0/inboxes/{inbox_id}/messages/{message_id}/attachments/{attachment_id}:
    get:
      operationId: inboxes_messages_getAttachment
      summary: Get Attachment
      description: '**CLI:**

        ```bash

        agentmail inboxes messages get-attachment --inbox-id --message-id --attachment-id

        ```'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      - name: message_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/messages_MessageId'
      - name: attachment_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/attachments_AttachmentId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/attachments_AttachmentResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
  /v0/inboxes/{inbox_id}/messages/{message_id}/raw:
    get:
      operationId: inboxes_messages_getRaw
      summary: Get Raw Message
      description: '**CLI:**

        ```bash

        agentmail inboxes messages get-raw --inbox-id --message-id

        ```'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      - name: message_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/messages_MessageId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages_RawMessageResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Bearer: []
  /v0/inboxes/{inbox_id}/messages/send:
    post:
      operationId: inboxes_messages_send
      summary: Send Message
      description: '**CLI:**

        ```bash

        agentmail inboxes messages send --inbox-id --to recipient@example.com --subject "Hello" --text "Body"

        ```'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages_SendMessageResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/messages_SendMessageRequest'
      security:
      - Bearer: []
  /v0/inboxes/{inbox_id}/messages/{message_id}/reply:
    post:
      operationId: inboxes_messages_reply
      summary: Reply To Message
      description: '**CLI:**

        ```bash

        agentmail inboxes messages reply --inbox-id --message-id --text "Reply text"

        ```'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      - name: message_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/messages_MessageId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages_SendMessageResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/messages_ReplyToMessageRequest'
      security:
      - Bearer: []
  /v0/inboxes/{inbox_id}/messages/{message_id}/reply-all:
    post:
      operationId: inboxes_messages_reply-all
      summary: Reply All Message
      description: '**CLI:**

        ```bash

        agentmail inboxes messages reply-all --inbox-id --message-id --text "Reply text"

        ```'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      - name: message_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/messages_MessageId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages_SendMessageResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/messages_ReplyAllMessageRequest'
      security:
      - Bearer: []
  /v0/inboxes/{inbox_id}/messages/{message_id}/forward:
    post:
      operationId: inboxes_messages_forward
      summary: Forward Message
      description: '**CLI:**

        ```bash

        agentmail inboxes messages forward --inbox-id --message-id --to recipient@example.com

        ```'
      tags:
      - inboxes > messages
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/inboxes_InboxId'
      - name: message_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/messages_MessageId'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages_SendMessageResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/messages_SendMessageRequest'
      security:
      - Bearer: []
components:
  schemas:
    messages_SearchMessageHighlights:
      type: object
      properties:
        from:
          type: array
          items:
            type: string
          description: Matched fragments from the sender address.
        recipients:
          type: array
          items:
            type: string
          description: Matched fragments from the recipient addresses (to, cc, or bcc).
        subject:
          type: array
          items:
            type: string
          description: Matched fragments from the subject.
        text:
          type: array
          items:
            type: string
          description: Matched fragments from the message body.
      description: 'Matched fragments per field on a message search result, with matched terms

        wrapped in `**`. A field key is present only when the query matched that

        field, so the present keys also tell you which fields produced the hit.'
      title: SearchMessageHighlights
    messages_BatchUpdateMessagesMessageIds:
      type: array
      items:
        $ref: '#/components/schemas/messages_MessageId'
      description: 'IDs of messages to update. Maximum 50 ids per request. Duplicates are

        rejected with a validation error. IDs not found in the inbox (including

        cross-inbox or permission-restricted) are silently excluded from the

        update; callers detect exclusions by comparing `count` against `limit`.'
      title: BatchUpdateMessagesMessageIds
    PageToken:
      type: string
      description: Page token for pagination.
      title: PageToken
    ErrorDocs:
      type: string
      description: Link to the error reference entry for this code.
      title: ErrorDocs
    agentArmor_AgentArmorFeedbackActor:
      oneOf:
      - type: object
        properties:
          kind:
            type: string
            enum:
            - api_key
            description: 'Discriminator value: api_key'
          api_key_id:
            type: string
            description: The API key that sent it.
        required:
        - kind
        - api_key_id
      - type: object
        properties:
          kind:
            type: string
            enum:
            - console
            description: 'Discriminator value: console'
        required:
        - kind
      discriminator:
        propertyName: kind
      description: Who sent the feedback.
      title: AgentArmorFeedbackActor
    messages_MessageAuthenticationResults:
      type: object
      properties:
        spf:
          $ref: '#/components/schemas/messages_MessageAuthenticationVerdict'
        dkim:
          $ref: '#/components/schemas/messages_MessageAuthenticationVerdict'
        dmarc:
          $ref: '#/components/schemas/messages_MessageAuthenticationVerdict'
        spf_domain:
          $ref: '#/components/schemas/messages_MessageAuthenticationDomain'
          description: Envelope MAIL FROM domain the `spf` verdict is about (`smtp.mailfrom`).
        dkim_domain:
          $ref: '#/components/schemas/messages_MessageAuthenticationDomain'
          description: 'Signing domain the `dkim` verdict is about (`header.d`). Present only when `dkim` is

            `pass` or `fail`.'
        dmarc_domain:
          $ref: '#/components/schemas/messages_MessageAuthenticationDomain'
          description: From domain the `dmarc` verdict is about (`header.from`).
        arc_sealer:
          $ref: '#/components/schemas/messages_MessageAuthenticationDomain'
          description: 'Domain of the trusted forwarder whose ARC seal the verdicts were taken from, such as

            `google.com`. Present only on forwarded mail, and only beside at least one verdict.'
      description: "Per-mechanism SPF, DKIM, and DMARC verdicts for a received message, each with the domain it\nis about, kept only where they speak for the sender's From identity. A verdict that could\nnot be computed is absent, so the field can be `{}`. The field is absent on sent messages\nand on messages received before 2026-09-09; the `*_domain` and `arc_sealer` keys appear on\nmessages received after they were introduced.\n\nThe verdicts are the ones Amazon SES computed when the message reached AgentMail, with one\nexception. Forwarded mail fails DMARC at the receiving hop by construction. When AgentMail\ndelivers a forwarded message as authenticated because a trusted forwarder (such as Google or\nMicrosoft) sealed a valid ARC chain vouching for the original, the field reports the\nverdicts that forwarder recorded for the original message, and `arc_sealer` names it.\n\n- `spf` is about the envelope MAIL FROM (Return-Path) domain, named in `spf_domain`. It is\n  present only when that domain is aligned with the sender's domain (the From mailbox, or\n  the Sender header when From spans domains), meaning the two share an organizational\n  domain: `mail.example.com` is aligned with `example.com`. An unaligned SPF result is\n  withheld whatever its value.\n- `dkim` is the DKIM verdict, and `dkim_domain` the signing domain (the `d=` tag). On\n  directly received mail the domain is named only when every DKIM signature on the message\n  is from the same domain; a message signed by more than one domain (a sender and its email\n  provider, for instance) keeps the verdict and omits the domain. `dkim_domain` is the\n  signing domain as written, so compare it with the From domain before relying on it.\n- `dmarc` is the DMARC verdict for the From domain, named in `dmarc_domain`.\n- `dkim` and `dmarc` are withheld when the From list spans more than one domain or could not\n  be fully parsed.\n- On forwarded mail each sealed verdict is reported only when the domain the forwarder\n  recorded it for matches the message's current From domain. If the forwarder rewrote From,\n  or vouched for nothing, the field is `{}`.\n\nThe `unauthenticated` label, not this field, is AgentMail's acceptance decision, and it uses\na looser rule, so the two can disagree: a single-From message whose only pass is an\nunaligned envelope SPF is delivered without the label while this field shows no pass. Use\nthe label to tell whether AgentMail accepted the message as legitimate, and this field to\nsee which domain each mechanism authenticated. Do not reject mail on `dmarc: fail` alone."
      title: MessageAuthenticationResults
