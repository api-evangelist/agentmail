aid: agentmail
name: AgentMail
description: 'AgentMail is an API-first email platform that gives AI agents their own
  email inboxes to autonomously send, receive, reply to, and act on email. Unlike traditional
  transactional email APIs built for one-way notifications, AgentMail is designed for
  two-way threaded conversations: agents create inboxes on demand, read and semantically
  search messages, manage threads and drafts for human-in-the-loop review, apply labels
  and allow/block lists, and react to inbound mail in real time over webhooks or WebSockets.
  It ships a REST API (OpenAPI 3.1), an AsyncAPI 2.6 WebSocket surface, Python/Node/Go
  SDKs, a CLI, a hosted MCP server, and IMAP/SMTP bridges, with API-key permissions,
  idempotency, multi-tenant pods, custom domains, and SOC 2 Type I/II compliance.'
